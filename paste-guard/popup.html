<!doctype html>
<!-- popup.html: the small window that opens when you click the Paste Guard icon. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Paste Guard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.5 4.5 5.4v6.1c0 4.6 3.1 8.7 7.5 10 4.4-1.3 7.5-5.4 7.5-10V5.4L12 2.5Z" />
        <path class="tick" d="m8.6 12.2 2.3 2.3 4.6-4.8" />
      </svg>
      <div>
        <h1>Paste Guard</h1>
        <p>Local protection for sensitive pastes</p>
      </div>
    </div>
    <button id="open-settings-icon" class="icon-btn" title="Settings &amp; tools" aria-label="Open settings and tools">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
    </button>
  </header>

  <!-- Master switch: turns protection on/off on every site at once. -->
  <section id="power" class="power" data-on="true">
    <div class="power-text">
      <strong id="status-title">Protection on</strong>
      <span id="status-sub">Loading…</span>
    </div>
    <label class="switch">
      <input id="enabled" type="checkbox" role="switch" aria-label="Turn Paste Guard on or off everywhere" disabled>
      <span class="track"><span class="thumb"></span></span>
    </label>
  </section>

  <!-- Session counter. Only counts per type, never the real values. -->
  <section class="stats">
    <div class="count"><span id="count">0</span><span class="count-label">items protected<br>this session</span></div>
    <div id="types" class="chips" aria-label="Protected items by type"></div>
  </section>

  <!-- Sites where Paste Guard switches on automatically. -->
  <section class="card">
    <div class="card-head">
      <h2>Active sites</h2>
      <span class="hint">Runs automatically</span>
    </div>
    <ul id="sites" class="sites"></ul>
    <button id="add-current" class="add-current" type="button" hidden></button>
    <form id="add-form" class="add-form">
      <input id="site-input" type="text" placeholder="Add a site, e.g. claude.ai" autocomplete="off" spellcheck="false" aria-label="Website to protect">
      <button type="submit">Add</button>
    </form>
    <p id="message" class="message" role="status" aria-live="polite"></p>
  </section>

  <section class="card tools-card"><h2>Settings &amp; tools</h2><p>Manage website and phrase rules, preview text, and run detection checks.</p><button id="open-settings" class="settings-button" type="button">Open settings &amp; tools <span aria-hidden="true">&rarr;</span></button></section>
  <footer>

    <span class="local"><span class="dot"></span>No network requests</span>
  </footer>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
