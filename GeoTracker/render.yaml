services:
  - type: web
    name: geotracker
    runtime: python
    rootDir: GeoTracker
    buildCommand: pip install -r backend/requirements.txt && npm ci --prefix frontend --include=dev && python manage.py build
    startCommand: python -m uvicorn hosted:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABRICKS_HOST
        sync: false
      - key: DATABRICKS_CLIENT_ID
        sync: false
      - key: DATABRICKS_CLIENT_SECRET
        sync: false
      - key: DATABRICKS_WAREHOUSE_ID
        value: f281300984d67642
